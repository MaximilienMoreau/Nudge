name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nudge_test
          POSTGRES_USER: nudge_test
          POSTGRES_PASSWORD: nudge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nudge_test -d nudge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/*.test.mjs
      - run: for file in frontend/js/*.js extension/*.js; do node --check "$file"; done
      - run: mvn -B -f backend/pom.xml verify
        env:
          NUDGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/nudge_test
          NUDGE_TEST_DB_USERNAME: nudge_test
          NUDGE_TEST_DB_PASSWORD: nudge_test
      - run: docker build -f backend/Dockerfile -t nudge:ci .
      - name: Smoke test packaged application
        run: |
          docker run --detach --name nudge-ci --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://localhost:5432/nudge_test \
            -e DB_USERNAME=nudge_test -e DB_PASSWORD=nudge_test \
            -e JWT_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e NOTIFICATION_EMAIL_ENABLED=false nudge:ci
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 --max-time 5 http://localhost:8080/actuator/health
          curl --fail http://localhost:8080/index.html
      - name: Container logs
        if: always()
        run: docker logs nudge-ci || true
      - name: Stop smoke test container
        if: always()
        run: docker rm -f nudge-ci || true
