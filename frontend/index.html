<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nudge — Sign In</title>
  <script>if(localStorage.getItem('nudge_theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    #pw-strength {
      font-size: .78rem;
      font-weight: 600;
      margin-top: .25rem;
      min-height: 1.2em;
      transition: color .2s;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          <path d="M14.05 2a9 9 0 0 1 8 7.94"/>
          <path d="M14.05 6A5 5 0 0 1 18 10"/>
        </svg>
      </div>
      <div style="flex:1">
        <h1>Nudge</h1>
        <p>AI-powered email intelligence</p>
      </div>
      <button id="theme-toggle-btn" onclick="toggleTheme()"
              style="background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;line-height:1;border-radius:6px;transition:color .2s;font-size:1rem"
              title="Toggle light/dark mode"></button>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" id="tab-login"    onclick="showTab('login')">Sign In</button>
      <button class="tab-btn"        id="tab-register" onclick="showTab('register')">Create Account</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required/>
      </div>
      <div id="login-error" style="color:var(--danger);font-size:.85rem;margin-bottom:.75rem;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required/>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min. 8 chars, mix of letters + numbers" minlength="8" required/>
        <div id="pw-strength"></div>
      </div>
      <div id="reg-error" style="color:var(--danger);font-size:.85rem;margin-bottom:.75rem;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="reg-btn">Create Account</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
